<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>폼 관련 태그 실습</title>
</head>
<body>
  <h1>회원가입</h1>

  <form>
    <fieldset>
      <legend>필수 입력 사항</legend>
      <table>
        <tr>
          <td><label for="userId">ID</label></td>
          <td><input type="text" id="userId" name="userId" placeholder="아이디 10글자 이내"></td>
          <td>
            <button type="button">중복 확인</button>
          </td>
        </tr>
        <tr>
          <td><label for="userPwd">비밀번호</label></td>
          <td colspan="2"><input type="password" id="userPwd" name="userPwd" style="width:80%"
                                 placeholder="영문,숫자,특수문자 포함 8자 이상"></td>
        </tr>
        <tr>
          <td><label for="userPwdConfirm">비밀번호 확인</label></td>
          <td colspan="2"><input type="password" id="userPwdConfirm" name="userPwdConfirm" style="width:80%">
          </td>
        </tr>
        <tr>
          <td><label for="email">Email</label></td>
          <td><input type="text" id="email" name="email"></td>
          <td>
            <select name="emailDomain">
              <option value="">직접입력</option>
              <option value="naver.com">naver.com</option>
              <option value="gmail.com">gmail.com</option>
              <option value="daum.net">daum.net</option>
            </select>
          </td>
        </tr>
      </table>

    </fieldset>


    <fieldset>
      <legend>추가 정보</legend>
      <label>프로필 사진 </label>
      <input type="file" name="uploadfile" multiple> <br>

      <p>
        <label>성별: </label>
        <input id="male" type="radio" name="gender" value="M" checked>
        <label for="male">남자</label>
        <input id="female" type="radio" name="gender" value="F">
        <label for="female">여자</label>
      </p>

      <p>
        <label for="birthdate">생년월일 : </label>
        <input type="date" id="birthdate" name="birthdate" placeholder="연도-월-일">
      </p>

      <label>취미</label> <br>
      <input type="checkbox" id="baseball" name="hobby" value="야구">
      <label for="baseball">야구</label>
      <input type="checkbox" id="basketball" name="hobby" value="농구">
      <label for="basketball">농구</label>
      <input type="checkbox" id="football" name="hobby" value="축구">
      <label for="football">축구</label> <br>
      <input type="checkbox" id="study" name="hobby" value="공부" checked>
      <label for="study">공부</label>

      <input type="checkbox" id="music" name="hobby" value="공부">
      <label for="music">음악 감상</label> <br>

      <input type="checkbox" id="add" name="hobby" value="공부">
      <label for="add">기타 : </label>
      <input type="search" name="searchtext"><br>

      <br>
      <label>자기소개</label> <br>
      <textarea name="contents" id="" cols="50" rows="5"
                style="resize:none"></textarea>
      <br>

    </fieldset>
  </form>

  <br>
  <p style="margin-left : 15px">
    <button>회원가입</button>
    <button>다시입력</button>
    <button>이전으로</button>
  </p>

</body>
</html>
