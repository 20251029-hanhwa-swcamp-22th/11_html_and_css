<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
</head>
<body>
  <h1>회원가입</h1>
  <form>
    <fieldset>
      <legend>필수 입력 사항</legend>
      <table>
        <tr>
          <th>ID</th>
          <td>
            <input type="text" placeholder="아이디 10글자 이내">
          </td>
          <td>
            <button type="button">중복 확인</button>
          </td>
        </tr>
        
        <tr>
          <th >비밀번호</th>
          <td colspan="2">
            <input type="text" size="30" placeholder="영문,숫자,특수문자 포함 8자 이상">
          </td>
        </tr>
        <tr>
          <th>비밀번호 확인</th>
          <td  colspan="2">
            <input type="text" size="30">
          </td>
        </tr>
        <tr>
          <th>Email</th>
          <td>
            <input type="email">
          </td>
          <td>
            <select name="직접입력">
              <option value="text">직접입력</option>
            </select>
          </td>
        </tr>
        
        
        </th>
      </table>
    </fieldset>
  </form>
  
  <form>
    
    <fieldset>
      <legend>추가 정보</legend>
      <label> 프로필 사진
      <input type="file" name="uploadfile" multiple>
      </label>
      <br>
      <br>
      <label>성별:<input id="male" type="radio" name="gender" value="M" checked>
      <label for="male">남자</label>
      <input id="female" type="radio" name="gender" value="F">
      <label for="female">여자</label>    </label>
      <br>
      <br>
      <label>생년월일: </label><input type="date" name="date"><br>
      <br>
      <label>취미: </label><br>
      <input type="checkbox" id="baseball" name="hobby" value="야구" checked>
      <label for="baseball">야구</label>
      &nbsp;&nbsp;<input type="checkbox" id="basketball" name="hobby" value="농구" checked>
      <label for="basketball">농구</label>
      &nbsp;&nbsp;<input type="checkbox" id="football" name="hobby" value="축구">
      <label for="football">축구</label>
      <br>
      <input type="checkbox" id="study" name="hobby" value="야구" checked>
      <label for="baseball">공부</label>
      <input type="checkbox" id="music" name="hobby" value="농구" checked>
      <label for="basketball">음악감상</label><br>
      <input type="checkbox" id="etc" name="hobby" value="농구" checked>
      <label for="basketball">기타 : </label><input type="text">
      <br>
      <br>
      <label>자기소개</label>
      <br>
      <textarea name="contents" id="" cols="50" rows="4"
                style="resize:none"></textarea>
        
      </textarea>
      
    </fieldset>
  </form>

</body>
</html>
